perform_action:
  name: Habit action
  description: Complete, undo, add/remove a configured step or set a quantity directly using an authenticated dashboard entity.
  target:
    entity:
      integration: habit_tracker
      domain: sensor
  fields:
    habit_id:
      required: true
      selector:
        text:
    action:
      required: true
      selector:
        select:
          options:
            - complete
            - uncomplete
            - increment
            - decrement
            - set_value
    value:
      description: Total period value in the habit unit, required only for set_value.
      selector:
        number:
          min: 0
          max: 1000000000000
          step: any
          mode: box
