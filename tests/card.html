<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Habit Tracker card regression fixture</title>
<style>body{margin:0;padding:32px;background:#10170d;color:#e1e5d8;font-family:Arial,sans-serif;--primary-text-color:#e1e5d8;--secondary-text-color:#b6bda9;--ha-card-background:#30382b;--card-background-color:#30382b;--divider-color:#434c3b;--primary-color:#75b7ad;--secondary-background-color:#404938;--text-primary-color:#10170d}main{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:24px;align-items:start}ha-card{box-sizing:border-box}@media(max-width:700px){body{padding:12px}main{grid-template-columns:1fr}}</style><main></main><script type="module" src="/card.js"></script><script>
const make=(id,name,category,kind,unit,target,progress,color,illustration='plain',step=1)=>({habit:{id,name,category,kind,unit},target,progress,percent:progress/target*100,eligible:true,actionable:true,completed:progress>=target,presentation:{color,illustration,step,weight:1}});
window.items=[make('run','Course','sport','quantity','meters',25000,22000,'#6e9cc7'),make('swim','Natation','sport','quantity','meters',3000,1400,'#75b7ad'),make('reading','Lecture','mind','boolean','count',1,1,'#a996c8'),make('meditation','Méditation','mind','boolean','count',1,1,'#a996c8'),make('journal','Journaling','mind','boolean','count',1,1,'#a996c8'),make('tidying','Rangement','daily','boolean','count',1,1,'#cfaa70'),make('water','Hydratation','nutrition','quantity','milliliters',2000,1750,'#cf8898','water',250),make('produce','Fruits et légumes','nutrition','quantity','count',5,3,'#91ae85','portions')];
window.renderFixture=()=>{const groups=['sport','mind','daily','nutrition'].map(category=>{const habits=items.filter(h=>h.habit.category===category);return {category,habits,percent:habits.reduce((s,h)=>s+h.percent,0)/habits.length,completed:habits.filter(h=>h.completed).length,eligible:habits.length};});const state={entity_id:'sensor.habits_fixture',state:String(groups.reduce((s,g)=>s+g.percent,0)/4),attributes:{groups}};document.querySelectorAll('habit-tracker-card').forEach(card=>{card.hass={states:{'sensor.habits_fixture':state},callService:async()=>{}};});};
customElements.whenDefined('habit-tracker-card').then(()=>{for(const mode of ['rings','nutrition']){const card=document.createElement('habit-tracker-card');card.id=mode;card.setConfig({type:'custom:habit-tracker-card',entity:'sensor.habits_fixture',mode});document.querySelector('main').append(card);}renderFixture();window.fixtureReady=true;});
window.setWater=value=>{const water=items.find(h=>h.habit.id==='water');water.progress=value;water.percent=value/water.target*100;water.completed=value>=water.target;renderFixture();};
</script></html>
